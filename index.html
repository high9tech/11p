<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIGH TECH PS - install cash </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0b0f19, #1a233a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-top: 20px;
        }
        .logo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            border: 3px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #1f4068, #162447);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
        }
        .logo-text {
            font-size: 22px;
            font-weight: bold;
            color: #00d2ff;
            text-align: center;
            line-height: 1.2;
        }
        h1 {
            font-size: 32px;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #a0aec0;
            font-size: 16px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
            margin: 20px 0;
        }
        .section-title {
            font-size: 20px;
            color: #f6ad55;
            margin-bottom: 15px;
            border-bottom: 2px solid #f6ad55;
            padding-bottom: 5px;
            display: inline-block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .btn-jailbreak {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }
        .btn-jailbreak:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.6);
        }
        .btn-jailbreak:active {
            transform: translateY(1px);
        }
        .btn-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .btn-sub {
            font-size: 14px;
            color: #e2e8f0;
        }
        #alert {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid #00d2ff;
            color: #00d2ff;
            font-size: 16px;
            text-align: center;
            display: none;
        }
        footer {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>

    <footer>

            alertBox.innerHTML = `جاري تفعيل تعديل ${consoleType} للإصدارات (${range}) بواسطة HIGH TECH PS...`;

        // تسجيل الكاش للعمل بدون انترنت
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log("Cache Registered Successfully!"))
            .catch((err) => console.log("Cache Registration Failed", err));

</body>
</html>
